[package]
name = "mutinynet-cli"
version = "0.1.3"
edition = "2021"
description = "CLI tool for the Mutinynet faucet"
authors = ["Ben Carman <benthecarman@live.com>"]
license = "MIT"
repository = "https://github.com/benthecarman/mutinynet-cli"

[dependencies]
anyhow = "1"
bitcoin = "0.32"
bitcoin-payment-instructions = { version = "0.7", features = ["std"] }
bitreq = { version = "0.3", features = ["https"] }
clap = { version = "4", features = ["derive", "env"] }
lightning-invoice = { version = "0.34", features = ["std"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
